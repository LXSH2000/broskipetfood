<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BROSKI | Billing & Delivery Portal</title>
<meta name="description" content="Official GST Composition Scheme Bill of Supply & Delivery Challan Generator for BROSKI Pet Food.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #352016;
  --primary-light: #523425;
  --accent: #b8452b;
  --accent-soft: rgba(184, 69, 43, 0.08);
  --cream: #fff8ed;
  --surface: #ffffff;
  --card-bg: #faf6f0;
  --border: #e6dcce;
  --text: #221c18;
  --text-muted: #6f6259;
  --green: #15803d;
  --green-bg: #dcfce7;
  --amber: #b45309;
  --amber-bg: #fef3c7;
  --font-main: 'DM Sans', -apple-system, sans-serif;
  --font-display: 'Outfit', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: #ede6dc;
  color: var(--text);
  line-height: 1.45;
  padding: 24px 16px 80px;
}

.app-container {
  max-width: 1380px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 28px;
  align-items: start;
}

/* Control Panel (Sidebar) */
.control-panel {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(53, 32, 22, 0.06);
  padding: 22px;
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.panel-header h2 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-section {
  margin-bottom: 22px;
}

.section-label {
  font-family: var(--font-display);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.field-group {
  margin-bottom: 12px;
}

.field-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.input, select, textarea {
  width: 100%;
  padding: 9px 12px;
  font-family: var(--font-main);
  font-size: 13.5px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg);
  color: var(--text);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
}

.input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: #ffffff;
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.mode-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  background: rgba(0, 0, 0, .06);
  border-radius: 10px;
}

.mode-btn {
  min-height: 44px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .2s ease, color .2s ease;
}

.mode-btn.active {
  background: #352016;
  color: #fff8ed;
}

.mode-btn:focus-visible {
  outline: 2px solid #c0562b;
  outline-offset: 2px;
}

.preset-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.preset-pill {
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.preset-pill:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 700;
  border-radius: 9px;
  border: none;
  cursor: pointer;
  transition: background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  text-decoration: none;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  width: 100%;
}

.btn-primary:hover {
  background: var(--accent);
  box-shadow: 0 4px 12px rgba(184, 69, 43, 0.25);
}

.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 1.5px solid var(--border);
  width: 100%;
}

.btn-outline:hover {
  border-color: var(--primary);
  background: var(--card-bg);
}

.btn-action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

/* Item Row Box */
.item-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}

.item-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.item-card-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
}

.btn-remove-item {
  background: none;
  border: none;
  color: #dc2626;
  font-size: 11px;
  cursor: pointer;
  font-weight: 600;
}

/* Printable Bill Sheet (Canvas) */
.preview-canvas {
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(53, 32, 22, 0.08);
  padding: 40px;
  min-height: 840px;
  border: 1px solid var(--border);
}

.inv-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 2px solid var(--primary);
  padding-bottom: 18px;
  margin-bottom: 20px;
}

.brand-block h1 {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-block .tagline {
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
  margin-top: 2px;
}

.brand-details {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.45;
  margin-top: 6px;
}

.bill-badge-block {
  text-align: right;
}

.bill-heading {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 0.5px;
}

.statutory-composition-pill {
  display: inline-block;
  background: var(--cream);
  border: 1px dashed var(--accent);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--primary);
  text-align: right;
  margin-top: 6px;
  line-height: 1.35;
}

.inv-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 18px;
}

.meta-col p {
  font-size: 11.5px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}

.meta-col p span {
  color: var(--text-muted);
}

.parties-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 22px;
}

.party-box {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  background: #ffffff;
}

.party-box h4 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent);
  margin-bottom: 6px;
}

.party-name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}

.party-desc {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.45;
}

/* Items Table */
.items-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 22px;
}

.items-table th {
  background: var(--primary);
  color: #fff;
  font-family: var(--font-display);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 10px;
  text-align: left;
}

.items-table td {
  padding: 10px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  vertical-align: middle;
}

.items-table tr:nth-child(even) td {
  background: #fdfbf7;
}

.item-title {
  font-weight: 700;
  color: var(--primary);
}

.item-sub {
  font-size: 10.5px;
  color: var(--text-muted);
}

.scheme-tag {
  display: inline-block;
  background: var(--green-bg);
  color: var(--green);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 9.5px;
  font-weight: 700;
  margin-left: 4px;
}

/* Totals Area */
.totals-area {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 24px;
  margin-bottom: 24px;
  align-items: start;
}

.amount-words-box {
  background: var(--card-bg);
  border-radius: 8px;
  border: 1px solid var(--border);
  padding: 12px;
}

.amount-words-box h5 {
  font-size: 10.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.amount-words-text {
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--primary);
}

.upi-scan-card {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: #fdfbf7;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}

.qr-code-holder {
  width: 80px;
  height: 80px;
  background: #fff;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  flex-shrink: 0;
}

.qr-code-holder img {
  width: 100%;
  height: 100%;
  display: block;
}

.upi-info {
  font-size: 11px;
}

.upi-info strong {
  display: block;
  font-size: 12px;
  color: var(--primary);
}

.totals-table {
  width: 100%;
  font-size: 12.5px;
}

.totals-table tr td {
  padding: 6px 4px;
}

.totals-table tr.grand-total td {
  border-top: 2px solid var(--primary);
  border-bottom: 2px solid var(--primary);
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  color: var(--primary);
  padding: 10px 4px;
}

/* Terms & Signatures */
.footer-declarations {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 24px;
  border-top: 1px solid var(--border);
  padding-top: 18px;
  font-size: 11px;
  color: var(--text-muted);
}

.declarations-list {
  padding-left: 14px;
  line-height: 1.5;
}

.signature-box {
  text-align: right;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  min-height: 90px;
}

.signature-line {
  margin-top: 40px;
  border-top: 1px solid #444;
  padding-top: 4px;
  width: 180px;
  text-align: center;
  font-weight: 700;
  color: var(--primary);
}

.top-nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--primary);
  font-weight: 700;
  font-size: 13px;
  text-decoration: none;
}

.back-link:hover {
  color: var(--accent);
}

.badge-mode {
  background: var(--primary);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}

.challan-triplicate-note {
  font-size: 10px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 12px;
  font-style: italic;
}

.receipt-ack-box {
  margin-top: 16px;
  padding: 10px;
  border: 1px dashed var(--border);
  border-radius: 6px;
  font-size: 10.5px;
}

/* Print Rules */
@media print {
  body {
    background: #fff;
    padding: 0;
  }
  .control-panel, .top-nav-bar, .no-print {
    display: none !important;
  }
  .app-container {
    display: block;
  }
  .preview-canvas {
    box-shadow: none;
    border: none;
    padding: 0;
    min-height: auto;
  }
}

@media (max-width: 980px) {
  body {
    padding: 12px 10px 60px;
  }
  .app-container {
    grid-template-columns: 100%;
    min-width: 0;
    gap: 16px;
  }
  .control-panel {
    position: static;
    max-height: none;
    min-width: 0;
    padding: 16px;
  }
  main {
    min-width: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .preview-canvas {
    padding: 20px 14px;
    min-width: 540px;
  }
  .top-nav-bar {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
}
</style>
</head>
<body>

<div class="app-container">

  <!-- Sidebar Form Controls -->
  <aside class="control-panel no-print">
    <div class="panel-header">
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        Broski Billing Hub
      </h2>
      <span class="badge-mode" id="headerModeBadge">Composition 1%</span>
    </div>

    <!-- Document Type Toggle (Task 3) -->
    <div class="panel-section">
      <div class="section-label">Document Type</div>
      <div class="mode-toggle" role="radiogroup" aria-label="Document type">
        <button type="button" id="modeBill" class="mode-btn active" role="radio" aria-checked="true"
                onclick="setDocMode('bill')">Bill of Supply</button>
        <button type="button" id="modeChallan" class="mode-btn" role="radio" aria-checked="false"
                onclick="setDocMode('challan')">Delivery Challan</button>
      </div>
      <div class="field-group" id="purposeGroup" hidden style="margin-top:10px">
        <label for="dispatchPurpose">Purpose of Dispatch</label>
        <select id="dispatchPurpose" class="input" onchange="renderInvoice()">
          <option>Free Samples for Taste Test</option>
          <option>Supply of Goods on Approval / Consignment</option>
          <option>Display Jar and Counter Material (Returnable)</option>
        </select>
      </div>
      <div class="field-group" style="margin-top:10px">
        <label for="sellerGstin">Your GSTIN (leave empty until issued)</label>
        <input type="text" id="sellerGstin" class="input" value="" maxlength="15" placeholder="e.g. 07XXXXXXXXXX" oninput="renderInvoice()">
      </div>
    </div>

    <!-- Quick Billing Presets -->
    <div class="panel-section">
      <div class="section-label">⚡ Fast Order Presets</div>
      <div class="preset-pills">
        <button type="button" class="preset-pill" onclick="loadPreset('11plus1')">🔥 11+1 Bro Counter Box (Shop)</button>
        <button type="button" class="preset-pill" onclick="loadPreset('sampledrop')">🫙 10 Sampler Packs Drop</button>
        <button type="button" class="preset-pill" onclick="loadPreset('wholesale20')">📦 20-Pack Pet Shop Order</button>
      </div>
    </div>

    <!-- Invoice Header Details -->
    <div class="panel-section">
      <div class="section-label">📋 Document Parameters</div>
      <div class="grid-2">
        <div class="field-group">
          <label id="billNoLabel" for="billNo">Bill of Supply No.</label>
          <input type="text" id="billNo" class="input" value="BRS/26-27/001" oninput="renderInvoice()">
        </div>
        <div class="field-group">
          <label>Date</label>
          <input type="date" id="billDate" class="input" onchange="renderInvoice()">
        </div>
      </div>

      <!-- Dynamic UPI ID Input (Task 2) -->
      <div class="field-group" id="upiFieldGroup">
        <label for="upiIdInput">Your UPI ID for QR Code</label>
        <input type="text" id="upiIdInput" class="input" value="" placeholder="yourname@bank"
               autocomplete="off" spellcheck="false" inputmode="email"
               oninput="saveUpiId(); renderInvoice()">
        <small id="upiHint" style="font-size:11px;color:var(--text-muted)"></small>
      </div>

      <div class="grid-2" id="paymentMetaRow">
        <div class="field-group">
          <label>Payment Mode</label>
          <select id="paymentMode" class="input" onchange="renderInvoice()">
            <option value="UPI / Online Transfer">UPI / Instant QR</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="Cheque / NEFT">Cheque / Bank NEFT</option>
            <option value="15-Day Credit (Shop Scheme)">15-Day Credit Scheme</option>
          </select>
        </div>
        <div class="field-group">
          <label>Payment Status</label>
          <select id="paymentStatus" class="input" onchange="renderInvoice()">
            <option value="PAID">PAID (Clear)</option>
            <option value="PENDING / COD">PENDING / COD</option>
            <option value="15-DAY CREDIT">15-DAY CREDIT</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Recipient / Buyer Details -->
    <div class="panel-section">
      <div class="section-label">🏬 Buyer / Pet Shop Details</div>
      <div class="field-group">
        <label>Buyer Name / Shop Legal Name</label>
        <input type="text" id="buyerName" class="input" value="" placeholder="Enter shop or buyer name" oninput="renderInvoice()">
      </div>
      <div class="field-group">
        <label>Address & Locality</label>
        <input type="text" id="buyerAddress" class="input" value="" placeholder="Enter shop address or locality" oninput="renderInvoice()">
      </div>
      <div class="grid-2">
        <div class="field-group">
          <label>Phone / Contact</label>
          <input type="text" id="buyerPhone" class="input" value="" placeholder="+91 XXXXX XXXXX" oninput="renderInvoice()">
        </div>
        <div class="field-group">
          <label>GSTIN (Optional if B2C)</label>
          <input type="text" id="buyerGstin" class="input" value="" placeholder="07XXXXXXXXXXXXX" oninput="renderInvoice()">
        </div>
      </div>
    </div>

    <!-- Items Configuration -->
    <div class="panel-section">
      <div class="section-label">🦴 Line Items & Schemes</div>
      <div class="preset-pills" style="margin-bottom:8px">
        <button type="button" class="preset-pill" onclick="addPresetItem('pb400')">+ Peanut Butter (400g)</button>
        <button type="button" class="preset-pill" onclick="addPresetItem('nv400')">+ Bro Bites (400g)</button>
        <button type="button" class="preset-pill" onclick="addPresetItem('mx400')">+ Bro Mix (400g)</button>
      </div>
      <div id="itemsContainer"></div>
      <button type="button" class="btn btn-outline" style="margin-top:8px;" onclick="addItemRow()">+ Add Custom Line</button>
    </div>

    <!-- Extra Charges / Notes -->
    <div class="panel-section">
      <div class="grid-2">
        <div class="field-group">
          <label>Delivery / Freight (₹)</label>
          <input type="number" id="freight" class="input" value="0" min="0" oninput="renderInvoice()">
        </div>
        <div class="field-group">
          <label>Special Discount (₹)</label>
          <input type="number" id="extraDiscount" class="input" value="0" min="0" oninput="renderInvoice()">
        </div>
      </div>
      <div class="field-group">
        <label>Remarks / Scheme Note</label>
        <input type="text" id="billNotes" class="input" value="Introductory 11+1 carton offer with complimentary acrylic counter tasting jar." oninput="renderInvoice()">
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="panel-section">
      <button type="button" class="btn btn-primary" onclick="window.print()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
        </svg>
        Print / Save A4 PDF
      </button>

      <div class="btn-action-row">
        <button type="button" class="btn btn-outline" onclick="copyWhatsAppSummary()">
          📲 Copy WhatsApp Summary
        </button>
        <button type="button" class="btn btn-outline" onclick="resetForm()">
          🔄 Reset Form
        </button>
      </div>
    </div>
  </aside>

  <!-- Document Sheet (Canvas) -->
  <main>
    <div class="top-nav-bar no-print">
      <a href="/" class="back-link">

function getUpiId() {

  const hint = document.getElementById('upiHint');
  if (hint) {
    hint.textContent = v && !ok ? 'Check the UPI ID (example: name@bank). QR is hidden until it is valid.' : '';
  }
  return ok ? v : '';
}

function numberToWords(num) {
  const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
  const b = ['', '', 'Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

  function inWords(n) {
    if ((n = n.toString()).length > 9) return 'overflow';
    let n_arr = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
    if (!n_arr) return '';
    let str = '';
    str += (Number(n_arr[1]) != 0) ? (a[Number(n_arr[1])] || b[n_arr[1][0]] + ' ' + a[n_arr[1][1]]) + 'Crore ' : '';
    str += (Number(n_arr[2]) != 0) ? (a[Number(n_arr[2])] || b[n_arr[2][0]] + ' ' + a[n_arr[2][1]]) + 'Lakh ' : '';
    str += (Number(n_arr[3]) != 0) ? (a[Number(n_arr[3])] || b[n_arr[3][0]] + ' ' + a[n_arr[3][1]]) + 'Thousand ' : '';
    str += (Number(n_arr[4]) != 0) ? (a[Number(n_arr[4])] || b[n_arr[4][0]] + ' ' + a[n_arr[4][1]]) + 'Hundred ' : '';
    str += (Number(n_arr[5]) != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_arr[5])] || b[n_arr[5][0]] + ' ' + a[n_arr[5][1]]) : '';
    return str.trim();
  }
  const clean = Math.round(num);
  if (clean === 0) return "Zero Rupees Only";
  return "Rupees " + inWords(clean) + " Only";
}

  const freight = parseFloat(document.getElementById('freight').value) || 0;
  const grandTotal = Math.max(0, grossTotal + freight - extraDiscount);

  let text = `🐾 *BROSKI PET FOOD — ${docTitle}*\n` +
    `📄 *Document No:* ${billNo}\n` +
    `🏬 *Recipient:* ${buyerName}\n` +
    `📦 *Quantity:* ${totalBilledUnits} Packs${totalFreeUnits > 0 ? ` (+${totalFreeUnits} Free Scheme Packs)` : ''}\n`;

  if (!isChallan) {
    text += `💰 *Total Amount Payable:* ₹${grandTotal.toFixed(2)}\n` +
      `⚡ *Payment:* UPI / Cash on Delivery\n` +
      `📍 *Freshness Guarantee:* 15-day 100% Buyback\n\n`;
  } else {
    const purpose = document.getElementById('dispatchPurpose').value;
    text += `📋 *Purpose:* ${purpose}\n` +
      `🚚 *Issued under Rule 55 CGST Rules (Samples / Goods on Approval)*\n\n`;
  }
  text += `Thank you for partnering with BROSKI — Treats for your best bro! 🐕`;

  navigator.clipboard.writeText(text).then(() => {
    alert("✅ WhatsApp Summary copied to clipboard! Paste it to the shopkeeper.");
  }).catch(() => {
    alert(text);
  });
}

function resetForm() {
  setDocMode('bill');
  document.getElementById('billNo').value = "BRS/26-27/00" + Math.floor(Math.random() * 90 + 10);
  document.getElementById('billDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('buyerName').value = "";
  document.getElementById('buyerAddress').value = "";
  document.getElementById('buyerPhone').value = "";
  document.getElementById('buyerGstin').value = "";
  loadPreset('11plus1');
}

// Initial Render
renderFormItems();
renderInvoice();
</script>
