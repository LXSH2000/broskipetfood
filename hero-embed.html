<!--
  Broski homepage hero video: drop-in snippet.
  Files expected next to this page (from /final/web):
    broski-hero-desktop.mp4 / .webm / -poster.jpg   (16:9, 1920x1080)
    broski-hero-mobile.mp4  / .webm / -poster.jpg   (9:16, 1080x1920)
    broski-hero-*-720.mp4                           (lighter fallbacks for slow connections)
  The loops are muted, textless and seamless, so your own headline / CTA sits on top.
-->
<section class="broski-hero">
  <video class="broski-hero__video" autoplay muted loop playsinline preload="metadata"
         poster="broski-hero-desktop-poster.jpg" aria-hidden="true">
    <source src="broski-hero-mobile.webm"  type="video/webm" media="(max-aspect-ratio: 4/5)">
    <source src="broski-hero-mobile.mp4"   type="video/mp4"  media="(max-aspect-ratio: 4/5)">
    <source src="broski-hero-desktop.webm" type="video/webm">
    <source src="broski-hero-desktop.mp4"  type="video/mp4">
  </video>
  <div class="broski-hero__scrim"></div>
  <div class="broski-hero__content">
    <h1>Treats for your best bro.</h1>
    <a class="broski-hero__cta" href="/shop">Shop Broski</a>
  </div>
</section>

<style>
  .broski-hero { position: relative; height: min(100svh, 56.25vw + 0px); min-height: 520px; overflow: hidden; background: #f1e0c8; }
  @media (max-aspect-ratio: 4/5) { .broski-hero { height: 100svh; } }
  .broski-hero__video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* soft warm scrim so white type stays readable over bright frames */
  .broski-hero__scrim { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(40,22,12,.55) 0%, rgba(40,22,12,.15) 45%, rgba(40,22,12,0) 70%); }
  @media (max-aspect-ratio: 4/5) {
    .broski-hero__scrim { background: linear-gradient(0deg, rgba(40,22,12,.6) 0%, rgba(40,22,12,0) 55%); }
  }
  .broski-hero__content { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
    justify-content: center; padding: 0 clamp(16px, 7vw, 120px); color: #fff7e9; max-width: 720px; }
  @media (max-aspect-ratio: 4/5) { .broski-hero__content { justify-content: flex-end; padding-bottom: 12svh; } }
  .broski-hero h1 { font-size: clamp(2.2rem, 5vw, 4.5rem); line-height: 1.05; margin: 0 0 1.2rem; }
  .broski-hero__cta { align-self: flex-start; background: #c4452b; color: #fff7e9; padding: .9em 1.6em;
    border-radius: 999px; text-decoration: none; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .broski-hero__video { display: none; }
    .broski-hero { background: #f1e0c8 url(broski-hero-desktop-poster.jpg) center/cover; } }
</style>

<script>
  // <source media> is honoured by current Chrome/Firefox/Safari; this keeps older browsers right too
  (function () {
    var v = document.querySelector('.broski-hero__video'); if (!v) return;
    var mq = window.matchMedia('(max-aspect-ratio: 4/5)');
    function pick() {
      var m = mq.matches ? 'mobile' : 'desktop';
      v.poster = 'broski-hero-' + m + '-poster.jpg';
      if (v.currentSrc && v.currentSrc.indexOf(m) === -1) { v.load(); v.play().catch(function(){}); }
    }
    mq.addEventListener ? mq.addEventListener('change', pick) : mq.addListener(pick);
    pick();
  })();
</script>
