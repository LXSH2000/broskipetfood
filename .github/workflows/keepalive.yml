name: Supabase Database Keepalive

on:
  schedule:
    # Run at 06:00 UTC every 3 days to keep free database awake
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Notice: SUPABASE_URL or SUPABASE_ANON_KEY secret not yet configured in GitHub repo secrets."
            exit 0
          fi
          echo "Pinging Supabase get_my_summary RPC..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/rpc/get_my_summary" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_phone":"+919999999999","p_code":"TEST00"}')
          echo "Supabase responded with HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Database keepalive ping successful."
          else
            echo "Unexpected HTTP status: $STATUS"
          fi
